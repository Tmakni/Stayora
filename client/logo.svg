<svg viewBox="0 0 210 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sg" x1="178" y1="18" x2="28" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8EC4FD"/>
      <stop offset="42%"  stop-color="#7A70F2"/>
      <stop offset="100%" stop-color="#9C4FF6"/>
    </linearGradient>
    <linearGradient id="sg2" x1="178" y1="18" x2="28" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8EC4FD"/>
      <stop offset="42%"  stop-color="#7A70F2"/>
      <stop offset="100%" stop-color="#9C4FF6"/>
    </linearGradient>
  </defs>

  <!-- Main S stroke: upper-right cap → S-curve → lower-left cap -->
  <path
    d="M 150 42 C 192 42 192 95 102 100 C 12 106 12 160 54 160"
    stroke="url(#sg)"
    stroke-width="38"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Speech-bubble tail on the lower-left cap (cap center ≈ 54,160) -->
  <polygon points="37,172 14,202 56,178" fill="url(#sg2)"/>

  <!-- 2 × 2 rounded-square grid (house/chat icon) at S crossover ~(102,100) -->
  <rect x="89"  y="87"  width="11" height="11" rx="2.8" fill="white" opacity=".95"/>
  <rect x="106" y="87"  width="11" height="11" rx="2.8" fill="white" opacity=".95"/>
  <rect x="89"  y="104" width="11" height="11" rx="2.8" fill="white" opacity=".95"/>
  <rect x="106" y="104" width="11" height="11" rx="2.8" fill="white" opacity=".95"/>
</svg>
