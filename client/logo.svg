<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="38" stroke="white" stroke-width="2.8"/>
  <!-- Single diagonal ellipse — creates the coffee-bean/sphere effect -->
  <ellipse cx="50" cy="50" rx="38" ry="15" stroke="white" stroke-width="2.8" transform="rotate(-38 50 50)"/>
  <!-- Teal highlight glint at upper-right -->
  <path d="M 63 25 Q 69 21 72 27" fill="none" stroke="#7FC8CE" stroke-width="2.4" stroke-linecap="round"/>
</svg>
